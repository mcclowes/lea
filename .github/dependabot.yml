version: 2
updates:
  # Main package dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      # One PR/month for all minor + patch bumps. Majors stay separate so
      # breaking changes are reviewed individually.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # VSCode extension dependencies
  - package-ecosystem: "npm"
    directory: "/vscode-lea"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      vscode-lea-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docs site (Docusaurus) dependencies
  - package-ecosystem: "npm"
    directory: "/docusaurus"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      docusaurus-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
