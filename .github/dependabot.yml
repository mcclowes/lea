version: 2
updates:
  # Main package dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      # One PR/month for all minor + patch version bumps. Majors stay
      # separate so breaking changes are reviewed individually.
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Batch security fixes too, so CVE bumps don't trickle in one-per-PR.
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # VSCode extension dependencies
  - package-ecosystem: "npm"
    directory: "/vscode-lea"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      vscode-lea-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      vscode-lea-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
